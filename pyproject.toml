[project]
name = "contact-sync"
version = "0.1.0"
description = "Consolidate contact sources (Apple, Google, Instagram, Snapchat, LinkedIn, Facebook, more) into the life-data people estate"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "structlog>=25.1",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contact_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

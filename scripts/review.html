<style>

current=true]{background:var(--green);color:white}.group-link[aria-current=true] .small{color:#dfebdf}.group-link .small{white-space:nowrap}.progress{margin:18px 0 4px;font-size:12px}.track{height:4px;background:var(--line);border-radius:4px;overflow:hidden}.track i{display:block;background:var(--green);height:100%}main{padding:30px 36px 70px;min-width:0}.group-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}.group-head>div{min-width:0}h1{font-family:Georgia,serif;font-weight:400;letter-spacing:-1.5px;font-size:48px;line-height:1.1;margin:7px 0 0}h2{font-size:21px;font-weight:600;margin:0}h3{font-size:17px;line-height:1.3;margin:0 0 5px}h1,h2,h3,.group-link{overflow-wrap:anywhere}.nav{display:flex;gap:8px;flex-shrink:0}.intro{color:var(--muted);font-size:13px;margin:0 0 20px;max-width:760px}.cluster{border:1px solid var(--line);border-top:4px solid var(--green);border-radius:9px;margin:22px 0;padding:20px;background:#f0f3ed}.cluster .reason{margin:8px 0 14px;font-size:14px}.person-summary{border-left:3px solid var(--green);background:var(--soft);padding:14px 16px;margin:12px 0}.tags{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}.tag{border:1px solid #c9d6c6;border-radius:4px;padding:2px 6px;font-size:12px;overflow-wrap:anywhere}.context{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;margin:8px 0}.section-title{display:flex;gap:10px;justify-content:space-between;align-items:baseline;margin:20px 0 12px}.section-title h3{font-size:14px}.count{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{border:1px solid var(--line);background:var(--paper);border-radius:9px;overflow:hidden;display:flex;flex-direction:column;min-width:0}.cardbody{padding:16px;flex:1;min-width:0}.platform{font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:750;color:var(--green);margin-bottom:6px}.handle{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.photo{border:0;border-radius:0;padding:0;width:100%;height:190px;background:#e9e8e1;display:flex;align-items:center;justify-content:center;position:relative}.photo:hover{background:#e0e5dc}.photo img{height:100%;width:100%;object-fit:contain}.photo span{position:absolute;bottom:8px;right:8px;font-size:10px;background:#fffe;padding:3px 6px;border-radius:4px}.missing{height:75px;background:#eeede6;display:grid;place-items:center;color:var(--muted);font-size:12px}.facts{margin:9px 0}.facts div{font-size:12px;margin:6px 0;overflow-wrap:anywhere}.facts b{font-weight:600;color:var(--muted)}.empty{padding:24px;background:var(--warm);border-radius:8px;color:var(--muted)}details{font-size:12px;margin-top:10px}summary{cursor:pointer;color:var(--green);overflow-wrap:anywhere}pre{font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:280px;overflow:auto}textarea{min-height:100px;resize:vertical;margin-top:8px}.review-footer{margin-top:30px;border-top:1px solid var(--line);padding-top:20px}.review-footer label{font-size:13px;font-weight:600}.review-footer .actions{justify-content:flex-end;margin-top:12px}.notice{font-size:12px;color:var(--muted);margin-top:8px}.status-error{color:#9b2925;font-weight:650}.uncertain,.previous-response{background:var(--warm);border-left:3px solid #9b7534;border-radius:4px;padding:12px 16px;margin:12px 0}.unassigned{margin:26px 0;border:1px dashed #9d998c;border-radius:9px;padding:18px}.preview-strip{display:flex;gap:8px;overflow:auto;margin:10px 0}.preview-strip>div{flex:0 0 80px;min-width:0}.preview-strip .photo{height:80px;border-radius:5px}.preview-strip .photo span{display:none}.preview-strip .quiet{font-size:10px;overflow-wrap:anywhere}.preview-strip img{object-fit:cover}.card a{font-size:12px;display:block;overflow-wrap:anywhere}dialog{border:0;border-radius:10px;padding:18px;background:var(--bg);max-width:min(850px,95vw);max-height:95vh}dialog::backdrop{background:#14221de0}dialog img{display:block;max-width:100%;max-height:75vh;margin:12px auto;object-fit:contain}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:25px}.dialog-head h2{font-size:17px}
.cluster{padding:16px;margin:16px 0}.cluster>h2{font-size:19px}.cluster .reason{margin:4px 0 10px;font-size:13px}.cluster-overview{display:grid;grid-template-columns:minmax(190px,1fr) minmax(0,2fr);gap:18px}.cluster-overview>div{min-width:0}.cluster-sources{font-size:11px;color:var(--muted);margin:4px 0}.person-summary.compact{border:0;background:transparent;padding:0;margin:0 0 10px}.person-summary.compact h3{font-size:14px;display:inline}.person-summary.compact .tags{margin:4px 0}.google-summary{margin:8px 0}.google-summary .cardbody{padding:0}.google-summary h3{font-size:14px}.google-summary .facts{margin:3px 0}.google-summary .facts div{margin:2px 0}.google-summary .platform{margin:0}.cluster-photos{flex-wrap:wrap;overflow:visible;align-content:flex-start;margin:0}.cluster-photos>div{flex-basis:120px}.cluster-photos .photo,.cluster-photos .missing{height:120px}.cluster-photos .photo img{object-fit:contain}.cluster-photos .platform{margin:4px 0 0}.cluster-photos .handle{font-size:11px}.full-evidence{border-top:1px solid var(--line);padding-top:8px;margin-top:10px}.full-evidence>summary{font-size:12px}
@media(min-width:1450px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.google-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1080px){main{padding:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{grid-template-columns:200px minmax(0,1fr)}}
@media(max-width:700px){.cluster-overview{grid-template-columns:1fr;gap:8px}.cluster-photos>div{flex-basis:110px}.cluster-photos .photo,.cluster-photos .missing{height:110px}.apphead{padding:16px;gap:12px}.brand span{display:block;margin:0;font-size:11px}.save{display:none}.actions{gap:8px}.shell{display:block}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:15px}.sidefilters{grid-template-columns:1fr 1fr}.sidefilters>input{grid-column:1/-1}.group-list{display:flex;overflow:auto;max-height:85px;margin:10px 0 0}.group-link{width:auto;flex:none;max-width:90%}.progress{margin-top:10px}main{padding:22px 16px}.group-head{align-items:flex-start;flex-direction:column;gap:12px}h1{font-size:39px}.grid,.google-grid{grid-template-columns:1fr}.photo{height:240px}.cluster,.unassigned{padding:14px}.section-title{align-items:flex-start}.section-title .count{text-align:right}}

<body>
<header class="apphead"><div class="brand">People<span>Private review</span></div><div class="actions"><div class="save" id="save-state" role="status" aria-live="polite"></div><button id="export" class="primary">Export choices</button></div></header>
<div id="storage-warning" role="alert" hidden style="padding:12px 24px;background:#fce9df;color:#8a2520"></div>
<div class="shell"><aside aria-label="Review groups"><div class="eyebrow">Your review queue</div><div class="progress" id="progress"></div><div class="track"><i id="progress-bar"></i></div><div class="sidefilters" style="margin-top:16px"><input id="group-search" type="search" placeholder="Find a name..." aria-label="Find a name group"><label>Batch<select id="batch"><option value="">All batches</option></select></label><label>Show<select id="review-filter"><option value="">All groups</option><option value="pending">To review</option><option value="reviewed">Reviewed</option></select></label></div><nav id="groups" class="group-list" aria-label="Name groups"></nav></aside><main id="main"></main></div>
<dialog id="lightbox" aria-labelledby="photo-title"><div class="dialog-head"><h2 id="photo-title"></h2><button id="close-photo">Close photo</button></div><img id="large-photo" alt=""></dialog>
<script id="review-data" type="application/json">__REVIEW_DATA__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('review-data').textContent);
const $=id=>document.getElementById(id);
const storageKey='people-review:v2:'+DATA.snapshot_id,legacyKey='people-review:v1:'+DATA.snapshot_id;
let state={responses:{},previous_responses:{}},legacyRaw=null,legacy=null,active=0,storageError='';
const object=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
try{
  const saved=JSON.parse(localStorage.getItem(storageKey)||'null');
  if(saved!==null){if(!object(saved)||!object(saved.responses)||!object(saved.previous_responses))throw new Error('Invalid state');state=saved;}
}catch{storageError='Browser saving could not be loaded. Export choices before closing.';}
try{legacyRaw=localStorage.getItem(legacyKey);try{legacy=JSON.parse(legacyRaw);}catch{}}catch{storageError='Browser saving is unavailable. Export choices before closing.';}
const group=()=>DATA.groups[active];
const decode=v=>{if(typeof v!=='string')return v;try{return JSON.parse(v)}catch{return v}};
const text=v=>{v=decode(v);return v==null?'':typeof v==='object'?JSON.stringify(v,null,2):String(v)};
function el(tag,content,cls){const e=document.createElement(tag);if(content!=null)e.textContent=content;if(cls)e.className=cls;return e;}
function link(label,url){try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))return null;const a=el('a',label);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';return a;}catch{return null;}}
function button(label,action,cls){const b=el('button',label,cls);b.type='button';b.onclick=action;return b;}
function isReviewed(g){const r=state.responses[g.key];return !!(r&&r.proposal_id===g.proposal_id&&r.submitted&&((r.type==='approval'&&g.proposal?.clusters.length&&!r.text)||(r.type==='correction'&&r.text?.trim())));}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state));storageError='';}catch{storageError='Could not save in this browser. Export choices before closing.';}updateStatus();renderGroups();}
function updateStatus(){const n=Object.keys(state.responses).length;$('save-state').textContent=storageError||`${n} group responses saved in this browser`;$('save-state').className='save'+(storageError?' status-error':'');$('storage-warning').hidden=!storageError;$('storage-warning').textContent=storageError;}
function filteredGroups(){const q=$('group-search').value.toLocaleLowerCase(),b=$('batch').value,r=$('review-filter').value;return DATA.groups.map((g,i)=>({g,i})).filter(({g})=>g.name.toLocaleLowerCase().includes(q)&&(!b||g.batch===b)&&(!r||(r==='reviewed')===isReviewed(g)));}
function renderGroups(){
  const n=DATA.groups.filter(isReviewed).length;$('progress').textContent=`${n} of ${DATA.groups.length} groups reviewed`;$('progress-bar').style.width=(DATA.groups.length?n/DATA.groups.length*100:0)+'%';$('groups').replaceChildren();
  for(const {g,i}of filteredGroups()){const b=button('',()=>{active=i;render();focusGroup();},'group-link'),r=state.responses[g.key];b.setAttribute('aria-current',String(i===active));b.append(el('span',g.name),el('span',isReviewed(g)?(r.type==='approval'?'Approved':'Correction'):r?.proposal_id!==undefined&&r.proposal_id!==g.proposal_id?'Changed':r?'Draft':'Pending','small'));$('groups').append(b);}
  if(!$('groups').childElementCount)$('groups').append(el('p','No matching groups.','quiet'));
}
function focusGroup(){const heading=$('main').querySelector('h1');heading?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function navigate(delta){const visible=filteredGroups().map(x=>x.i),at=visible.indexOf(active),next=visible[at+delta];if(next!==undefined){active=next;render();focusGroup();}}
function writeResponse(type,content,submitted){
  const g=group(),old=state.responses[g.key];
  if(old&&(old.proposal_id!==g.proposal_id||old.submitted)) (state.previous_responses[g.key]||=[]).push(old);
  state.responses[g.key]={proposal_id:g.proposal_id,type,text:content,submitted,updated_at:new Date().toISOString()};save();
}
function submitResponse(type){
  const g=group();if(!g)return;
  const content=state.responses[g.key]?.text||'';
  if(type==='approval'&&(!g.proposal?.clusters.length||content.length))return;
  if(type==='correction'&&!content.trim())return;
  const visible=filteredGroups().map(x=>x.i),at=visible.indexOf(active);
  writeResponse(type,content,true);
  const remaining=filteredGroups().map(x=>x.i);
  active=visible.slice(at+1).find(i=>remaining.includes(i))??remaining.find(i=>i!==active)??(remaining.includes(active)?active:-1);
  render();focusGroup();
}
function fact(container,label,value){if(value==null||value===''||value==='[]')return;const d=el('div');d.append(el('b',label+': '),document.createTextNode(text(value)));container.append(d);}
function original(container,row,label='All saved fields'){const d=el('details');d.append(el('summary',label),el('pre',JSON.stringify(row,null,2)));container.append(d);}
function formatBirthday(d){return [d.year||'Unknown year',String(d.month||'?').padStart(2,'0'),String(d.day||'?').padStart(2,'0')].join('-');}
function photo(container,row){
  const path=DATA.photos[row.avatar_r2_key];if(!path){container.append(el('div','No saved photo','missing'));return;}
  const name=row.display_name||row.name||row.handle||'this account',b=button('',()=>{$('photo-title').textContent=`${name} · ${row.platform||'Saved photo'}`;$('large-photo').src=path;$('large-photo').alt=`Saved profile photo of ${name}`;$('lightbox').showModal();},'photo');
  const img=el('img');img.src=path;img.alt=`Saved profile photo of ${name}`;img.loading='lazy';img.onerror=()=>b.replaceWith(el('div','Photo could not load','missing'));b.setAttribute('aria-label',`Enlarge photo of ${name}`);b.append(img,el('span','View photo'));container.append(b);
}
function personCard(p,compact=false){
  const card=el('article',null,'person-summary'+(compact?' compact':''));card.dataset.personId=p.id;if(!compact)card.append(el('div','Current person entry','eyebrow'));card.append(el('h3',p.name||'Unnamed person'));
  const tags=el('div',null,'tags'),circles=decode(p.circles);for(const c of Array.isArray(circles)?circles:circles?[circles]:[])tags.append(el('span',String(c),'tag'));card.append(tags);if(compact)return card;
  if(p.notes)card.append(el('p',p.notes,'context'));const f=el('div',null,'facts');fact(f,'Birthday',p.birthday);fact(f,'Also known as',p.nickname);card.append(f);original(card,p);return card;
}
function googleCard(c,compact=false){
  const card=el('article',null,compact?'google-summary':'card google-card'),body=el('div',null,'cardbody'),raw=decode(c.raw)||{};card.dataset.recordId=c.id;body.append(el('div','Google Contacts','platform'),el('h3',c.name||'Unnamed contact'));
  const f=el('div',null,'facts');for(const org of raw.org||[])fact(f,'Company / context',[org.name,org.title,org.department].filter(Boolean).join(' · '));
  for(const birthday of raw.birthday||[])fact(f,'Birthday',birthday.date?formatBirthday(birthday.date):birthday.text||birthday);
  for(const key of ['context','notes','birthday','circles'])fact(f,key[0].toUpperCase()+key.slice(1),c[key]);
  body.append(f);
  if(compact){card.append(body);return card;}
  const url=c.source_id?.startsWith('people/')?'https://contacts.google.com/person/'+encodeURIComponent(c.source_id.slice(7)):null,a=link('Open Google contact',url);if(a)body.append(a);original(body,c);card.append(body);return card;
}
function profileCard(p){
  const card=el('article',null,'card profile-card');card.dataset.recordId=p.record_id;photo(card,p);const body=el('div',null,'cardbody');body.append(el('div',p.platform,'platform'),el('h3',p.display_name||p.source_name||p.handle||'Unnamed account'));
  if(p.handle)body.append(el('div',p.handle,'handle'));if(p.bio)body.append(el('p',p.bio,'context'));
  const f=el('div',null,'facts');for(const [label,key]of [['Location','location'],['Hometown','hometown'],['Education','education'],['Work','work'],['Birthday','birthday']])fact(f,label,p[key]);body.append(f);
  const a=link('Open '+p.platform+' profile',p.profile_url);if(a)body.append(a);if(p.status==='matched'||p.person_id)body.append(el('p','Already linked in People DB. Any change needs agent review.','quiet'));original(body,p);card.append(body);return card;
}
function clusterOverview(container,ids){
  const g=group(),people=g.current_people.filter(p=>ids.person_ids.includes(p.id)),contacts=g.google_candidates.filter(c=>ids.record_ids.includes(c.id)),profiles=g.profiles.filter(p=>ids.record_ids.includes(p.record_id));
  const sources=[...(contacts.length?['Google Contacts']:[]),...new Set(profiles.map(p=>p.platform))];container.append(el('p',sources.join(' · '),'cluster-sources'));
  const overview=el('div',null,'cluster-overview'),context=el('div');for(const p of people)context.append(personCard(p,true));for(const c of contacts)context.append(googleCard(c,true));
  const strip=el('div',null,'preview-strip cluster-photos');for(const p of profiles){const tile=el('div');photo(tile,p);tile.append(el('div',p.platform,'platform'),el('div',p.handle||p.display_name||p.source_name||'Unnamed account','handle'));if(p.status==='matched'||p.person_id)tile.append(el('div','Already linked in People DB','quiet'));strip.append(tile);}overview.append(context,strip);container.append(overview);
}
function evidence(container,ids){
  const g=group();for(const p of g.current_people.filter(p=>ids.person_ids.includes(p.id)))container.append(personCard(p));
  for(const [title,rows,make,cls]of [
    ['Google contacts',g.google_candidates.filter(c=>ids.record_ids.includes(c.id)),googleCard,'google-grid'],
    ['Social profiles',g.profiles.filter(p=>ids.record_ids.includes(p.record_id)),profileCard,'profile-grid']
  ]){if(!rows.length)continue;const h=el('div',null,'section-title');h.append(el('h3',title),el('span',`${rows.length} saved ${title==='Social profiles'?'profiles':'contacts'}`,'count'));const grid=el('div',null,'grid '+cls);for(const row of rows)grid.append(make(row));container.append(h,grid);}
}
function preservedContext(root,g){
  const old=[...(state.previous_responses[g.key]||[])],response=state.responses[g.key];
  if(response&&response.proposal_id!==g.proposal_id)old.push(response);
  if(old.length){const box=el('section',null,'previous-response');box.id='previous-response';box.append(el('h2',response&&response.proposal_id!==g.proposal_id?'Proposal changed - review again':'Previous responses preserved'),el('p','Earlier responses are reference only. Approval applies only to the proposal shown when it was saved.','context'));
    for(const r of old){box.append(el('p',`${r.type==='approval'?'Approval':r.submitted?'Correction':'Correction draft'} · ${r.updated_at}`,'quiet'));if(r.text)box.append(el('p',r.text,'context'));}root.append(box);}
  if(legacyRaw!==null){const box=el('section',null,'legacy-context');box.id='legacy-context';box.append(el('h2','Earlier review context'),el('p','Your original notes and selections are preserved. They do not approve these proposals.','quiet'));
    if(legacy?.notes?.[g.key])box.append(el('p',text(legacy.notes[g.key]),'context'));
    const people=new Set(g.current_people.map(p=>p.id)),records=new Set([...g.google_candidates.map(c=>c.id),...g.profiles.map(p=>p.record_id)]);
    for(const [key,r]of Object.entries(legacy?.decisions||{})){const pair=decode(key);if(people.has(r?.person_id)||records.has(r?.record_id)||(Array.isArray(pair)&&(people.has(pair[0])||records.has(pair[1])))){const person=g.current_people.find(p=>p.id===(r?.person_id||pair?.[0])),record=[...g.google_candidates,...g.profiles].find(p=>(p.id||p.record_id)===(r?.record_id||pair?.[1]));box.append(el('p',`${person?.name||'Current person'} / ${record?.name||record?.display_name||record?.handle||'Source account'}: ${r?.choice||'Saved selection'}`,'context'));}}
    const details=el('details');details.append(el('summary','Original review data, unchanged'),el('pre',legacyRaw));box.append(details);root.append(box);
  }
}
function render(){
  renderGroups();const root=$('main');root.replaceChildren();const g=group();
  if(!g){const h=el('h1','No groups in this view');h.tabIndex=-1;root.append(h,el('p','Adjust the sidebar filters or export your saved responses.','empty'));updateStatus();return;}
  const h=el('div',null,'group-head'),title=el('div'),heading=el('h1',g.name);heading.tabIndex=-1;title.append(el('div',g.batch+' / '+(active+1)+' of '+DATA.groups.length,'eyebrow'),heading);
  const nav=el('div',null,'nav'),visible=filteredGroups().map(x=>x.i),at=visible.indexOf(active),prev=button('Previous',()=>navigate(-1)),next=button('Skip / Next',()=>navigate(1));prev.disabled=at<=0;next.disabled=at<0||at===visible.length-1;next.id='skip-next';nav.append(prev,next);h.append(title,nav);root.append(h,el('p','Choose Looks right to approve the groups shown, or describe a correction. Unassigned entries stay pending.','intro'));
  preservedContext(root,g);
  if(g.proposal){
    if(g.proposal.question)root.append(el('p','Unresolved question: '+g.proposal.question,'uncertain'));
    if(!g.proposal.clusters.length)root.append(el('p','No identity grouping is proposed yet. Keep this evidence pending, save a correction, or skip.','empty'));
    for(const [i,c]of g.proposal.clusters.entries()){const section=el('section',null,'cluster');section.dataset.clusterIndex=i;section.append(el('div','Proposed identity group','eyebrow'),el('h2',c.label),el('p',c.reason,'reason context'));
      if(c.person_ids.length>1)section.append(el('p',`Proposed combining of ${c.person_ids.length} current person entries. Keep every circle and resolve conflicting fields with the agent.`,'uncertain'));
      if(c.uncertainty)section.append(el('p','Still uncertain: '+c.uncertainty,'uncertain'));clusterOverview(section,c);const details=el('details',null,'full-evidence');details.append(el('summary','See full account details'));evidence(details,c);section.append(details);root.append(section);
    }
  }else root.append(el('p','Suggestions are not ready for this name group. All evidence remains unassigned. You can save a correction or skip; approval becomes available when suggestions are prepared.','empty'));
  const pending=g.unresolved,total=pending.person_ids.length+pending.record_ids.length;
  if(total){const section=el('section',null,'unassigned');section.id='unassigned';section.append(el('h2',`Unassigned evidence (${total})`),el('p',`${pending.person_ids.length} current people and ${pending.record_ids.length} source records remain unresolved. These are not assumed to be different people, and approval leaves them pending.`,'context'));
    const rows=g.profiles.filter(p=>pending.record_ids.includes(p.record_id)&&DATA.photos[p.avatar_r2_key]);
    const names=[...g.current_people.filter(p=>pending.person_ids.includes(p.id)).map(p=>p.name||'Unnamed person'),...g.google_candidates.filter(c=>pending.record_ids.includes(c.id)).map(c=>c.name||'Unnamed contact'),...g.profiles.filter(p=>pending.record_ids.includes(p.record_id)).map(p=>p.display_name||p.handle||'Unnamed account')];section.append(el('p',[...new Set(names)].join(' · '),'context'));
    if(total>6){if(rows.length){const strip=el('div',null,'preview-strip');for(const p of rows){const tile=el('div');photo(tile,p);tile.append(el('div',p.display_name||p.handle||p.platform,'quiet'));strip.append(tile);}section.append(strip);}const details=el('details');details.append(el('summary',`Show all ${total} unassigned people and records`));evidence(details,pending);section.append(details);}else evidence(section,pending);root.append(section);
  }
  const footer=el('section',null,'review-footer'),label=el('label','Correction for this name group'),notes=el('textarea');notes.id='correction';notes.placeholder='Describe what to change or what is still unclear.';notes.value=state.responses[g.key]?.text||'';label.htmlFor=notes.id;
  const status=el('p',null,'notice');status.id='response-status';status.setAttribute('role','status');
  const approve=button('Looks right & next',()=>submitResponse('approval'),'primary'),correct=button('Save correction & next',()=>submitResponse('correction'));approve.id='approve-next';correct.id='correction-next';
  function updateResponse(){approve.disabled=!g.proposal?.clusters.length||notes.value.length>0;correct.disabled=!notes.value.trim();const r=state.responses[g.key];status.textContent=isReviewed(g)?(r.type==='approval'?'Proposed groups approved. Unresolved evidence remains pending.':'Correction saved for agent review.'):(r?.proposal_id!==undefined&&r.proposal_id!==g.proposal_id?'Proposal changed. Your previous response is preserved above.':r?'Correction draft saved. Submit it to finish this group.':'Not reviewed. Skipping does not mark this group reviewed.');}
  notes.oninput=()=>{writeResponse('correction',notes.value,false);updateResponse();};updateResponse();
  const actions=el('div',null,'actions');actions.append(correct,approve);footer.append(label,notes,status,actions,el('p','Responses autosave in this browser. Export choices for the agent to review and apply. No source data is fetched and nothing is created or merged here.','notice'));root.append(footer);updateStatus();
}
function exportReview(){return {schema_version:2,snapshot_id:DATA.snapshot_id,exported_at:new Date().toISOString(),legacy_v1:legacy,legacy_v1_raw:legacyRaw,groups:DATA.groups.map(g=>({key:g.key,batch:g.batch,name:g.name,proposal:g.proposal,proposal_id:g.proposal_id,unresolved:g.unresolved,reviewed:isReviewed(g),response:state.responses[g.key]||null,previous_responses:state.previous_responses[g.key]||[]}))};}
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(exportReview(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='people-review-choices-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
for(const b of [...new Set(DATA.groups.map(g=>g.batch))]){const o=el('option',b);o.value=b;$('batch').append(o);}
for(const id of ['group-search','batch','review-filter'])$(id).addEventListener(id==='group-search'?'input':'change',()=>{const visible=filteredGroups();if(!visible.some(x=>x.i===active))active=visible[0]?.i??-1;render();});
$('close-photo').onclick=()=>$('lightbox').close();$('lightbox').onclick=e=>{if(e.target===$('lightbox'))$('lightbox').close();};
window.addEventListener('storage',e=>{if(e.key===storageKey){try{const next=JSON.parse(e.newValue);if(object(next)&&object(next.responses)&&object(next.previous_responses)){state=next;render();}}catch{}}});
render();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' file:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>People / Review</title>
<style>
:root{color-scheme:light;--bg:#f6f5f1;--paper:#fff;--ink:#222c29;--muted:#606e68;--line:#d9dfd8;--green:#245943;--soft:#e7eee5;--warm:#eeeadf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:9px 13px}button:hover{background:var(--soft)}button:disabled{opacity:.4;cursor:default}a{color:var(--green);text-underline-offset:3px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #3a8169;outline-offset:3px}.primary{background:var(--green);border-color:var(--green);color:white}.primary:hover{background:#153f2c}.quiet,.small{font-size:12px;color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:10px;font-weight:750;color:var(--muted)}.apphead{height:80px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 30px;border-bottom:1px solid var(--line);background:var(--bg)}.brand{font-family:Georgia,serif;font-size:28px;letter-spacing:-1px}.brand span{font:13px -apple-system,sans-serif;letter-spacing:0;margin-left:14px;color:var(--muted)}.actions{display:flex;align-items:center;gap:16px}.save{text-align:right;font-size:12px;max-width:270px}.shell{display:grid;grid-template-columns:225px minmax(0,1fr);max-width:1760px;margin:auto}aside{padding:26px 14px 30px 22px;border-right:1px solid var(--line);height:calc(100vh - 80px);position:sticky;top:0;overflow:auto}input[type=search],select,textarea{border:1px solid var(--line);border-radius:6px;background:white;padding:9px;width:100%;min-width:0}.sidefilters{display:grid;gap:10px}.sidefilters label{font-size:12px}.sidefilters label select{margin-top:4px}.group-list{display:grid;gap:3px;margin-top:17px}.group-link{text-align:left;width:100%;border-color:transparent;background:transparent;display:flex;justify-content:space-between;gap:8px;padding:9px 10px}.group-link[aria-current=true]{background:var(--green);color:white}.group-link[aria-current=true] .small{color:#dfebdf}.group-link .small{white-space:nowrap}.progress{margin:18px 0 4px;font-size:12px}.track{height:4px;background:var(--line);border-radius:4px;overflow:hidden}.track i{display:block;background:var(--green);height:100%}main{padding:30px 36px 70px;min-width:0}.group-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}h1{font-family:Georgia,serif;font-weight:400;letter-spacing:-1.5px;font-size:48px;line-height:1.1;margin:7px 0 0}h2{font-size:19px;font-weight:600;margin:0}h3{font-size:17px;line-height:1.3;margin:0 0 5px}.nav{display:flex;gap:8px}.intro{color:var(--muted);font-size:13px;margin:0 0 20px;max-width:730px}.person-tabs{display:flex;gap:8px;overflow:auto;padding:4px 3px 12px}.person-tab{text-align:left;flex:0 0 200px;max-width:240px}.person-tab strong{display:block}.person-tab[aria-pressed=true]{border:2px solid var(--green);background:var(--soft);padding:8px 12px}.person-summary{border-left:3px solid var(--green);background:var(--soft);padding:17px 20px;margin:0 0 26px}.person-summary h3{font-size:20px}.tags{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}.tag{border:1px solid #c9d6c6;border-radius:4px;padding:2px 6px;font-size:12px}.context{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;margin:8px 0}.section-title{display:flex;gap:10px;justify-content:space-between;align-items:baseline;margin:28px 0 13px}.count{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{border:1px solid var(--line);background:var(--paper);border-radius:9px;overflow:hidden;display:flex;flex-direction:column;min-width:0;scroll-margin-top:16px}.card[data-decision=same]{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}.card[data-decision=different]{background:#f1f0ec}.cardbody{padding:16px;flex:1;min-width:0}.platform{font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:750;color:var(--green);margin-bottom:6px}.handle{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.photo{border:0;border-radius:0;padding:0;width:100%;height:190px;background:#e9e8e1;display:flex;align-items:center;justify-content:center;position:relative}.photo:hover{background:#e0e5dc}.photo img{height:100%;width:100%;object-fit:contain}.photo span{position:absolute;bottom:8px;right:8px;font-size:10px;background:#fffE;padding:3px 6px;border-radius:4px}.missing{height:75px;background:#eeede6;display:grid;place-items:center;color:var(--muted);font-size:12px}.facts{margin:9px 0}.facts div{font-size:12px;margin:6px 0;overflow-wrap:anywhere}.facts b{font-weight:600;color:var(--muted)}.decision{border-top:1px solid var(--line);padding:12px 16px;margin-top:auto;background:#fafbf8}.decision label{font-size:11px;font-weight:650;display:block;margin-bottom:5px}.decision select{font-size:13px}.same-name{font-size:11px;color:var(--green);background:var(--soft);padding:8px 10px;border-radius:4px;margin:10px 0}.filters{display:flex;align-items:center;gap:10px;margin-bottom:15px}.filters input{flex:1}.filters select{width:155px}.filters label{white-space:nowrap;font-size:12px}.empty{padding:28px;background:var(--warm);border-radius:8px;color:var(--muted)}details{font-size:12px;margin-top:10px}summary{cursor:pointer;color:var(--green)}pre{font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:280px;overflow:auto}textarea{min-height:100px;resize:vertical;margin-top:8px}.review-footer{margin-top:30px;border-top:1px solid var(--line);padding-top:20px}.review-footer label{font-size:13px;font-weight:600}.review-footer .actions{justify-content:space-between;margin-top:12px}.notice{font-size:12px;color:var(--muted);margin-top:8px}.status-error{color:#9b2925;font-weight:650}dialog{border:0;border-radius:10px;padding:18px;background:var(--bg);max-width:min(850px,95vw);max-height:95vh}dialog::backdrop{background:#14221de0}dialog img{display:block;max-width:100%;max-height:75vh;margin:12px auto;object-fit:contain}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:25px}.dialog-head h2{font-size:17px}.bottom-nav{display:flex;justify-content:space-between;margin-top:25px}.card a{font-size:12px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.preview-strip{display:flex;gap:8px;overflow:auto;margin:8px 0 14px}.preview-strip>div{flex:0 0 80px;min-width:0}.preview-strip .photo{height:80px;border-radius:5px}.preview-strip .photo span{display:none}.preview-strip .quiet{font-size:10px}.preview-strip img{object-fit:cover}.person-summary{margin-top:10px;padding:12px 16px}.person-tabs+.person-summary{margin-top:0}
@media(min-width:1450px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.google-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:1080px){main{padding:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{grid-template-columns:200px minmax(0,1fr)}}@media(max-width:700px){.apphead{height:auto;min-height:76px;padding:16px;gap:12px}.brand span{display:block;margin:0;font-size:11px}.save{display:none}.actions{gap:8px}.shell{display:block}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:15px}.sidefilters{grid-template-columns:1fr 1fr}.sidefilters>input{grid-column:1/-1}.group-list{display:flex;overflow:auto;max-height:70px;margin:10px 0 0}.group-link{width:auto;flex:none}.progress{margin-top:10px}main{padding:22px 16px}.group-head{gap:12px}h1{font-size:39px}.grid{grid-template-columns:1fr}.google-grid{grid-template-columns:1fr}.photo{height:240px}.filters{flex-wrap:wrap}.filters input{flex-basis:100%}.filters select{flex:1}.section-title{align-items:flex-start}.section-title .count{text-align:right}.person-tab{flex-basis:180px}.review-footer .actions{flex-wrap:wrap}}
</style>
</head>
<body>
<header class="apphead"><div class="brand">People<span>Private review</span></div><div class="actions"><div class="save" id="save-state" role="status" aria-live="polite"></div><button id="export" class="primary">Export choices</button></div></header>
<div id="storage-warning" role="alert" hidden style="padding:12px 24px;background:#fce9df;color:#8a2520"></div>
<div class="shell"><aside aria-label="Review groups"><div class="eyebrow">Your review queue</div><div class="progress" id="progress"></div><div class="track"><i id="progress-bar"></i></div><div class="sidefilters" style="margin-top:16px"><input id="group-search" type="search" placeholder="Find a name..." aria-label="Find a name group"><label>Batch<select id="batch"><option value="">All batches</option></select></label><label>Show<select id="review-filter"><option value="">All groups</option><option value="pending">To review</option><option value="reviewed">Reviewed</option></select></label></div><nav id="groups" class="group-list" aria-label="Name groups"></nav></aside><main id="main"></main></div>
<dialog id="lightbox"><div class="dialog-head"><h2 id="photo-title"></h2><button id="close-photo">Close photo</button></div><img id="large-photo" alt=""></dialog>
<script id="review-data" type="application/json">__REVIEW_DATA__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('review-data').textContent);
const $=id=>document.getElementById(id);
const storageKey='people-review:v1:'+DATA.snapshot_id;
let state={decisions:{},notes:{},reviewed:{}},active=0,personIndex=0,storageError='';
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved&&saved.decisions&&saved.notes&&saved.reviewed)state=saved;}catch{storageError='Browser saving is unavailable. Export choices before closing.';}
const group=()=>DATA.groups[active];
const subject=()=>group()?.current_people[personIndex];
const decode=v=>{if(typeof v!=='string')return v;try{return JSON.parse(v)}catch{return v}};
const text=v=>{v=decode(v);return v==null?'':typeof v==='object'?JSON.stringify(v,null,2):String(v)};
function el(tag,content,cls){const e=document.createElement(tag);if(content!=null)e.textContent=content;if(cls)e.className=cls;return e;}
function link(label,url){try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))return null;const a=el('a',label);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';return a;}catch{return null;}}
function button(label,action,cls){const b=el('button',label,cls);b.type='button';b.onclick=action;return b;}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state));storageError='';}catch{storageError='Could not save in this browser. Export choices before closing.';}updateStatus();renderGroups();}
function updateStatus(){const n=Object.keys(state.decisions).length;$('save-state').textContent=storageError||`${n} choices saved in this browser`;$('save-state').className='save'+(storageError?' status-error':'');$('storage-warning').hidden=!storageError;$('storage-warning').textContent=storageError;}
function filteredGroups(){const q=$('group-search').value.toLocaleLowerCase(),b=$('batch').value,r=$('review-filter').value;return DATA.groups.map((g,i)=>({g,i})).filter(({g})=>g.name.toLocaleLowerCase().includes(q)&&(!b||g.batch===b)&&(!r||(r==='reviewed')===!!state.reviewed[g.key]));}
function renderGroups(){const n=Object.values(state.reviewed).filter(Boolean).length;$('progress').textContent=`${n} of ${DATA.groups.length} groups reviewed`;$('progress-bar').style.width=(DATA.groups.length?n/DATA.groups.length*100:0)+'%';$('groups').replaceChildren();for(const {g,i}of filteredGroups()){const b=button('',()=>{active=i;personIndex=0;render();});b.className='group-link';b.setAttribute('aria-current',String(i===active));b.append(el('span',g.name),el('span',state.reviewed[g.key]?'Reviewed':String(g.current_people.length)+(g.current_people.length===1?' person':' people'),'small'));$('groups').append(b);}if(!$('groups').childElementCount)$('groups').append(el('p','No matching groups.','quiet'));}
function navigate(delta){const visible=filteredGroups().map(x=>x.i),at=visible.indexOf(active),next=visible[at+delta];if(next!==undefined){active=next;personIndex=0;render();window.scrollTo({top:0,behavior:'instant'});}}
function fact(container,label,value){if(value==null||value===''||value==='[]')return;const d=el('div');d.append(el('b',label+': '),document.createTextNode(text(value)));container.append(d);}
function original(container,row){const d=el('details');d.append(el('summary','All saved fields'),el('pre',JSON.stringify(row,null,2)));container.append(d);}
function formatBirthday(d){return [d.year||'Unknown year',String(d.month||'?').padStart(2,'0'),String(d.day||'?').padStart(2,'0')].join('-');}
function normalized(value){return String(value||'').normalize('NFD').replace(/\p{M}/gu,'').toLocaleLowerCase().replace(/[^\p{L}]/gu,'');}
function namesakes(profile){const n=normalized(profile.display_name||profile.source_name);return n?group().google_candidates.filter(x=>normalized(x.name)===n):[];}
function choose(card,record,source){const p=subject();if(!p)return;const key=JSON.stringify([p.id,record.id||record.record_id]);const wrap=el('div',null,'decision'),label=el('label','Is this the selected person?'),select=el('select');select.setAttribute('aria-label',`${source}: ${record.name||record.display_name||record.handle||'Profile'} compared with selected person ${personIndex+1}`);for(const [v,t]of [['','Not reviewed'],['same','Same person'],['different','Different person'],['unsure','Not sure yet']]){const o=el('option',t);o.value=v;select.append(o);}select.value=state.decisions[key]?.choice||'';card.dataset.decision=select.value;select.onchange=()=>{if(select.value)state.decisions[key]={person_id:p.id,record_id:record.id||record.record_id,source,choice:select.value,updated_at:new Date().toISOString()};else delete state.decisions[key];card.dataset.decision=select.value;delete state.reviewed[group().key];save();const toggle=$('mark-reviewed');if(toggle)toggle.textContent='Mark group reviewed';};label.append(select);wrap.append(label);card.append(wrap);}
function photo(container,row){const path=DATA.photos[row.avatar_r2_key];if(!path){container.append(el('div','No saved photo','missing'));return;}const b=button('',()=>{$('photo-title').textContent=`${row.display_name||row.handle||'Profile'} · ${row.platform}`;$('large-photo').src=path;$('large-photo').alt=`Saved profile photo of ${row.display_name||row.handle||'this account'}`;$('lightbox').showModal();},'photo');const img=el('img');img.src=path;img.alt=`Saved profile photo of ${row.display_name||row.handle||'this account'}`;img.loading='lazy';img.onerror=()=>b.replaceWith(el('div','Photo could not load','missing'));b.setAttribute('aria-label',`Enlarge photo of ${row.display_name||row.handle||'this account'}`);b.append(img,el('span','View photo'));container.append(b);}
function renderProfiles(){const list=$('profiles');list.replaceChildren();const q=$('profile-search').value.toLocaleLowerCase(),platform=$('platform').value,onlyPhotos=$('only-photos').checked;const rows=group().profiles.filter(p=>(!platform||p.platform===platform)&&(!onlyPhotos||DATA.photos[p.avatar_r2_key])&&[p.display_name,p.handle,p.bio,p.location,p.hometown,p.education,p.work].some(v=>text(v).toLocaleLowerCase().includes(q))).sort((a,b)=>Number(namesakes(b).length>0)-Number(namesakes(a).length>0));$('profile-count').textContent=`${rows.length} of ${group().profiles.length} accounts`;for(const p of rows){const card=el('article',null,'card');photo(card,p);const body=el('div',null,'cardbody');body.append(el('div',p.platform,'platform'),el('h3',p.display_name||p.source_name||p.handle||'Unnamed account'));if(p.handle)body.append(el('div',p.handle,'handle'));const matching=namesakes(p);if(matching.length)body.append(el('div','Same name as '+matching.map(x=>x.name).join(' / ')+'. Identity unconfirmed.','same-name'));if(p.bio)body.append(el('p',p.bio,'context'));const f=el('div',null,'facts');for(const [label,key]of [['Location','location'],['Hometown','hometown'],['Education','education'],['Work','work'],['Birthday','birthday']])fact(f,label,p[key]);body.append(f);const a=link('Open '+p.platform+' profile',p.profile_url);if(a)body.append(a);if(p.status==='matched')body.append(el('p','Already linked in People DB. Review any change with the agent.','quiet'));original(body,p);card.append(body);choose(card,p,p.platform);list.append(card);}if(!rows.length)list.append(el('div','No accounts match these filters.','empty'));}
function render(){renderGroups();const root=$('main');root.replaceChildren();const g=group();if(!g){root.append(el('div','No groups to review.','empty'));return;}const h=el('div',null,'group-head'),title=el('div');title.append(el('div',g.batch+' / '+(active+1)+' of '+DATA.groups.length,'eyebrow'),el('h1',g.name));const nav=el('div',null,'nav');const visible=filteredGroups().map(x=>x.i),at=visible.indexOf(active);const prev=button('Previous',()=>navigate(-1)),next=button('Next',()=>navigate(1));prev.disabled=at<=0;next.disabled=at<0||at===visible.length-1;nav.append(prev,next);h.append(title,nav);root.append(h,el('p','Select a People DB entry, then compare the Google contacts and social accounts below. Photos and names are clues; your choices decide the matches.','intro'));
root.append(el('div','1. Select a person to compare','eyebrow'));const tabs=el('div',null,'person-tabs');g.current_people.forEach((p,i)=>{const b=button('',()=>{personIndex=i;render();},'person-tab');b.setAttribute('aria-pressed',String(personIndex===i));b.append(el('strong',`${i+1}. ${p.name||'Unnamed person'}`),el('span',text(decode(p.circles)||[]).replace(/[\[\]"\n]/g,'').trim()||'No circles saved','small'));tabs.append(b);});if(g.current_people.length>1)root.append(tabs);const p=subject();if(p){const summary=el('section',null,'person-summary');summary.append(el('div','Comparing every card below with','eyebrow'),el('h3',`${personIndex+1}. ${p.name||'Unnamed person'}`));const tags=el('div',null,'tags');const circles=decode(p.circles);for(const c of Array.isArray(circles)?circles:circles?[circles]:[])tags.append(el('span',String(c),'tag'));summary.append(tags);if(p.notes)summary.append(el('p',p.notes,'context'));const f=el('div',null,'facts');fact(f,'Birthday',p.birthday);fact(f,'Also known as',p.nickname);summary.append(f);original(summary,p);root.append(summary);}else root.append(el('p','No existing People DB entry in this group. Add any identification in the notes below.','empty'));
const gh=el('div',null,'section-title');gh.append(el('h2','2. Google contacts'),el('span',`${g.google_candidates.length} candidates`,'count'));root.append(gh);const google=el('div',null,'grid google-grid');for(const c of g.google_candidates){const card=el('article',null,'card'),body=el('div',null,'cardbody'),raw=decode(c.raw)||{};body.append(el('div','Google Contacts','platform'),el('h3',c.name||'Unnamed contact'));const f=el('div',null,'facts');for(const org of raw.org||[])fact(f,'Company / context',[org.name,org.title,org.department].filter(Boolean).join(' · '));for(const birthday of raw.birthday||[])fact(f,'Birthday',birthday.date?formatBirthday(birthday.date):birthday.text||birthday);body.append(f);const previews=g.profiles.filter(p=>normalized(p.display_name||p.source_name)===normalized(c.name)&&DATA.photos[p.avatar_r2_key]);if(previews.length){body.append(el('div','Same-name accounts · unconfirmed','quiet'));const strip=el('div',null,'preview-strip');for(const row of previews){const tile=el('div');photo(tile,row);tile.append(el('span',row.platform,'quiet'));strip.append(tile);}body.append(strip);}const url=c.source_id?.startsWith('people/')?'https://contacts.google.com/person/'+encodeURIComponent(c.source_id.slice(7)):null;const a=link('Open Google contact',url);if(a)body.append(a);original(body,c);card.append(body);choose(card,c,'google_contacts');google.append(card);}root.append(google);
const ph=el('div',null,'section-title');const count=el('span',null,'count');count.id='profile-count';ph.append(el('h2','3. Social profiles'),count);root.append(ph);const filters=el('div',null,'filters'),search=el('input');search.id='profile-search';search.type='search';search.placeholder='Search names, handles, schools, places...';search.setAttribute('aria-label','Search profile evidence');search.oninput=renderProfiles;const platforms=el('select');platforms.id='platform';platforms.setAttribute('aria-label','Filter profiles by platform');const all=el('option','All platforms');all.value='';platforms.append(all);for(const s of [...new Set(g.profiles.map(p=>p.platform))].sort()){const o=el('option',s);o.value=s;platforms.append(o);}platforms.onchange=renderProfiles;const photoLabel=el('label'),checkbox=el('input');checkbox.id='only-photos';checkbox.type='checkbox';checkbox.onchange=renderProfiles;photoLabel.append(checkbox,document.createTextNode(' With photos'));filters.append(search,platforms,photoLabel);root.append(filters);const profiles=el('div',null,'grid');profiles.id='profiles';root.append(profiles);renderProfiles();
const footer=el('section',null,'review-footer'),noteLabel=el('label','Notes for this group'),notes=el('textarea');notes.placeholder='Who is who? Add corrections, distinct people, or details to keep.';notes.value=state.notes[g.key]||'';notes.oninput=()=>{state.notes[g.key]=notes.value;save();};noteLabel.append(notes);const actions=el('div',null,'actions');const mark=button(state.reviewed[g.key]?'Mark group unreviewed':'Mark group reviewed',()=>{state.reviewed[g.key]=!state.reviewed[g.key];save();mark.textContent=state.reviewed[g.key]?'Mark group unreviewed':'Mark group reviewed';},'primary');mark.id='mark-reviewed';actions.append(el('span','All fields and circles stay intact. Nothing is merged by this page.','small'),mark);footer.append(noteLabel,actions,el('p','Choices stay in this browser. Export choices when you are ready, then send the JSON file to the agent to apply your decisions.','notice'));root.append(footer);updateStatus();}
function exportReview(){return {schema_version:1,snapshot_id:DATA.snapshot_id,exported_at:new Date().toISOString(),decisions:Object.values(state.decisions),groups:DATA.groups.map(g=>({key:g.key,batch:g.batch,name:g.name,reviewed:!!state.reviewed[g.key],notes:state.notes[g.key]||''}))};}
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(exportReview(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='people-review-choices-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
for(const b of [...new Set(DATA.groups.map(g=>g.batch))]){const o=el('option',b);o.value=b;$('batch').append(o);}
for(const id of ['group-search','batch','review-filter'])$(id).addEventListener(id==='group-search'?'input':'change',()=>{const visible=filteredGroups();if(visible.length&&!visible.some(x=>x.i===active)){active=visible[0].i;personIndex=0;}render();});
$('close-photo').onclick=()=>$('lightbox').close();$('lightbox').onclick=e=>{if(e.target===$('lightbox'))$('lightbox').close();};
window.addEventListener('storage',e=>{if(e.key===storageKey){try{const next=JSON.parse(e.newValue);if(next?.decisions&&next?.notes&&next?.reviewed){state=next;render();}}catch{}}});
render();
</script>
</body></html>
